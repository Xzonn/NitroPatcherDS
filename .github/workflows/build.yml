name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Build and package
        shell: pwsh
        run: ./build.ps1

      - name: Upload 3DS package
        uses: actions/upload-artifact@v7
        with:
          path: out/NitroPatcher3DS.zip
          archive: false
          if-no-files-found: error

      - name: Upload DSi package
        uses: actions/upload-artifact@v7
        with:
          path: out/NitroPatcherDSi.zip
          archive: false
          if-no-files-found: error

      - name: Upload NDS package
        uses: actions/upload-artifact@v7
        with:
          path: out/NitroPatcherDS.zip
          archive: false
          if-no-files-found: error

      - name: Create draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            out/NitroPatcher3DS.zip out/NitroPatcherDSi.zip out/NitroPatcherDS.zip \
            --draft --verify-tag --title "$RELEASE_TAG" --notes ""
