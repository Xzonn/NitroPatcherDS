exclude: ^vendor/

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++, json]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-format
        types_or: [python]
        args: [--isolated, --line-length=120]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --yes prettier@3.9.9 --write --ignore-unknown
        language: system
        types: [yaml]
        args: [--no-config, --no-editorconfig]
